name: Application quality
on:
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**', 'tests/**', 'package*.json', '*config*.js', 'AGENTS.md', '.github/workflows/quality.yml']
  pull_request:
    branches: [main]
    paths: ['src/**', 'scripts/**', 'tests/**', 'package*.json', '*config*.js', 'AGENTS.md', '.github/workflows/quality.yml']
  workflow_dispatch:
jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install chrome
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-evidence
          path: |
            docs/playwright-results.json
            docs/final-qa/axe-*.json
            test-results/
          retention-days: 14
